services:
  pulsar:
    image: apachepulsar/pulsar:3.3.6
    command: bin/pulsar standalone
    ports:
      - "6650:6650"
      - "8085:8080"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: notifications
      POSTGRES_USER: notifications
      POSTGRES_PASSWORD: notifications
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"

  ingest-api:
    build:
      context: ..
      dockerfile: notification-ingest/Dockerfile
    ports:
      - "8080:8080"
    environment:
      INGEST_API_KEYS: ${INGEST_API_KEYS:-dev-local-key}
      INGEST_PULSAR_ENABLED: "true"
      PULSAR_SERVICE_URL: pulsar://pulsar:6650
      PULSAR_TOPIC: persistent://public/default/activity-events
    depends_on:
      - pulsar

  notification-router:
    build:
      context: ..
      dockerfile: notification-ingest/notification-router/Dockerfile
    ports:
      - "8081:8081"
    environment:
      DATASOURCE_URL: jdbc:postgresql://postgres:5432/notifications
      DATASOURCE_USERNAME: notifications
      DATASOURCE_PASSWORD: notifications
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      ROUTER_PULSAR_ENABLED: "true"
      ROUTER_REGISTRY_MODE: jdbc
      ROUTER_DEDUP_MODE: redis
      ROUTER_FLAGS_MODE: redis
      PULSAR_SERVICE_URL: pulsar://pulsar:6650
      PULSAR_ACTIVITY_TOPIC: persistent://public/default/activity-events
      PULSAR_DISPATCH_TOPIC: persistent://public/default/notification-dispatch
      PULSAR_ACTIVITY_SUBSCRIPTION: router-activity
    depends_on:
      - pulsar
      - postgres
      - redis

  prometheus:
    image: prom/prometheus:v3.1.0
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - ingest-api
      - notification-router

volumes:
  postgres-data:
