global:
  scrape_interval: 15s

scrape_configs:
  - job_name: ingest-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["ingest-api:8080"]

  - job_name: notification-router
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["notification-router:8081"]

  - job_name: delivery-worker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["delivery-worker:8082"]
